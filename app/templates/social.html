<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUMA — 독자 피드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600&family=DM+Serif+Display:ital@0;1&family=Pretendard:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ── BASE ─────────────────────────────────────── */
:root{
  --bg:#050815; --panel:rgba(9,14,32,.86); --panel-solid:#090e20;
  --accent:#f5c86b; --accent-dim:rgba(245,200,107,.15); --accent-glow:rgba(245,200,107,.28);
  --text:#eef3ff; --muted:#9da9c7; --border:rgba(255,255,255,.08);
  --card:rgba(255,255,255,.04);
  --green:#4ade80; --red:#f87171; --blue:#60a5fa; --purple:#a78bfa;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text);font-family:'Pretendard',sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden;position:relative;}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px;}
a{text-decoration:none;color:inherit;}

/* ── STARFIELD ──────────────────────────────── */
#star-canvas{position:fixed;inset:0;z-index:0;pointer-events:none;}

/* ── NAV ────────────────────────────────────── */
.nav{display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:56px;background:rgba(5,8,21,.96);border-bottom:1px solid var(--border);flex-shrink:0;z-index:100;position:relative;}
.logo{display:flex;align-items:center;gap:9px;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 var(--accent-glow)}50%{box-shadow:0 0 0 8px transparent}}
.nav-links{display:flex;gap:2px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;}
.nav-links::-webkit-scrollbar{display:none;}
.npill{padding:6px 9px;border-radius:18px;font-size:.7rem;color:var(--muted);transition:.2s;cursor:pointer;text-decoration:none;white-space:nowrap;}
.npill:hover{background:var(--accent-dim);color:var(--accent);}
.npill.active{background:rgba(245,200,107,.16);color:var(--accent);font-weight:500;}
.nav-user{display:flex;align-items:center;gap:8px;font-size:.72rem;color:var(--muted);}
.nav-logout{background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.22);color:#f87171;padding:5px 12px;border-radius:8px;font-size:.72rem;cursor:pointer;font-family:'Pretendard',sans-serif;}
.nav-login-btn{background:var(--accent-dim);border:1px solid rgba(245,200,107,.28);color:var(--accent);padding:6px 14px;border-radius:18px;font-size:.74rem;}

/* ── LAYOUT ─────────────────────────────────── */
.app-body{flex:1;display:grid;grid-template-columns:250px 1fr 240px;overflow:hidden;position:relative;z-index:1;}

/* ── SIDEBARS ───────────────────────────────── */
.sidebar{background:var(--panel);backdrop-filter:blur(12px);overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:16px;}
.sidebar-l{border-right:1px solid var(--border);}
.sidebar-r{border-left:1px solid var(--border);}

.sb-section-title{font-size:.6rem;color:var(--muted);letter-spacing:.16em;text-transform:uppercase;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border);}

/* clubs */
.club-list{display:flex;flex-direction:column;gap:8px;}
.club-item{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:11px 13px;cursor:pointer;transition:.2s;}
.club-item:hover{border-color:rgba(245,200,107,.3);background:var(--accent-dim);}
.club-name{font-size:.82rem;color:var(--text);font-weight:500;margin-bottom:3px;}
.club-meta{font-size:.66rem;color:var(--muted);}
.club-book{font-size:.68rem;color:var(--accent);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* challenge */
.challenge-card{background:linear-gradient(135deg,rgba(15,20,50,.9),rgba(20,12,50,.9));border:1px solid rgba(167,139,250,.25);border-radius:14px;padding:14px;}
.ch-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.ch-title{font-size:.78rem;color:var(--text);font-weight:500;}
.ch-fraction{font-family:'DM Serif Display',serif;font-size:1.1rem;color:var(--purple);}
.ch-bar-track{height:6px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden;margin-bottom:6px;}
.ch-bar-fill{height:100%;background:linear-gradient(90deg,#7c3aed,#a78bfa);border-radius:3px;transition:width 1s ease;}
.ch-label{font-size:.64rem;color:var(--muted);line-height:1.5;}

/* badges */
.badge-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.badge-item{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;}
.badge-icon{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,rgba(245,200,107,.12),rgba(167,139,250,.12));border:1px solid rgba(245,200,107,.2);display:flex;align-items:center;justify-content:center;font-size:1.2rem;transition:.2s;}
.badge-icon:hover{background:rgba(245,200,107,.2);transform:scale(1.08);}
.badge-icon.locked{opacity:.35;filter:grayscale(1);}
.badge-name{font-size:.56rem;color:var(--muted);text-align:center;line-height:1.3;}

/* ── MAIN FEED ──────────────────────────────── */
.feed-main{display:flex;flex-direction:column;overflow:hidden;}
.feed-scroll{flex:1;overflow-y:auto;padding:18px 20px;}

/* compose */
.compose-card{background:var(--panel);backdrop-filter:blur(10px);border:1px solid rgba(245,200,107,.2);border-radius:18px;padding:16px;margin-bottom:18px;}
.compose-top{display:flex;gap:12px;margin-bottom:12px;}
.composer-avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#1e2f6e,#2d1b6e);display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0;}
.compose-textarea{flex:1;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:12px;padding:11px 14px;color:var(--text);font-family:'Noto Serif KR',serif;font-size:.84rem;resize:none;min-height:80px;outline:none;transition:.2s;line-height:1.7;}
.compose-textarea:focus{border-color:rgba(245,200,107,.35);}
.compose-textarea::placeholder{color:rgba(157,169,199,.45);}
.compose-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.compose-book-input{flex:1;min-width:140px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:7px 12px;color:var(--text);font-family:'Pretendard',sans-serif;font-size:.76rem;outline:none;transition:.2s;}
.compose-book-input:focus{border-color:rgba(245,200,107,.3);}
.compose-book-input::placeholder{color:rgba(157,169,199,.4);}
.style-pills{display:flex;gap:5px;flex-wrap:wrap;}
.style-pill{padding:5px 11px;border-radius:16px;font-size:.7rem;border:1px solid var(--border);background:none;color:var(--muted);cursor:pointer;font-family:'Pretendard',sans-serif;transition:.2s;}
.style-pill:hover{border-color:rgba(245,200,107,.3);color:var(--text);}
.style-pill.sel-dark{background:rgba(30,47,110,.5);border-color:rgba(96,165,250,.35);color:#93c5fd;}
.style-pill.sel-warm{background:rgba(80,40,15,.5);border-color:rgba(245,158,11,.35);color:#fbbf24;}
.style-pill.sel-cosmic{background:rgba(50,20,80,.5);border-color:rgba(167,139,250,.35);color:#c4b5fd;}
.style-pill.sel-forest{background:rgba(10,40,25,.5);border-color:rgba(74,222,128,.35);color:#6ee7b7;}
.style-pill.sel-pure{background:rgba(240,240,255,.06);border-color:rgba(255,255,255,.25);color:#e0e7ff;}
.compose-post-btn{background:linear-gradient(135deg,rgba(245,200,107,.25),rgba(245,200,107,.12));border:1px solid rgba(245,200,107,.4);color:var(--accent);padding:8px 18px;border-radius:12px;font-size:.78rem;cursor:pointer;font-family:'Pretendard',sans-serif;font-weight:500;transition:.2s;white-space:nowrap;}
.compose-post-btn:hover{background:linear-gradient(135deg,rgba(245,200,107,.35),rgba(245,200,107,.2));box-shadow:0 4px 18px var(--accent-glow);}

/* filter chips */
.filter-chips{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
.chip{padding:6px 15px;border-radius:20px;font-size:.72rem;cursor:pointer;border:1px solid var(--border);background:none;color:var(--muted);font-family:'Pretendard',sans-serif;transition:.2s;}
.chip.active,.chip:hover{border-color:rgba(245,200,107,.38);color:var(--accent);background:rgba(245,200,107,.08);}

/* feed cards */
.feed-list{display:flex;flex-direction:column;gap:14px;}

.feed-card{border-radius:18px;padding:16px;border:1px solid var(--border);position:relative;overflow:hidden;transition:.22s;}
.feed-card:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(0,0,0,.35);}

/* card style variants */
.card-dark{background:linear-gradient(145deg,rgba(10,16,45,.95),rgba(8,12,35,.9));border-color:rgba(96,165,250,.15);}
.card-warm{background:linear-gradient(145deg,rgba(45,22,8,.95),rgba(35,18,6,.9));border-color:rgba(245,158,11,.18);}
.card-cosmic{background:linear-gradient(145deg,rgba(30,10,55,.95),rgba(22,8,45,.9));border-color:rgba(167,139,250,.2);}
.card-forest{background:linear-gradient(145deg,rgba(6,30,18,.95),rgba(5,22,13,.9));border-color:rgba(74,222,128,.15);}
.card-pure{background:linear-gradient(145deg,rgba(18,22,45,.9),rgba(14,18,38,.9));border-color:rgba(224,231,255,.12);}

/* cosmic shimmer overlay */
.card-cosmic::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 80% 20%,rgba(167,139,250,.06) 0%,transparent 60%),radial-gradient(ellipse at 20% 80%,rgba(96,165,250,.05) 0%,transparent 60%);pointer-events:none;}

.card-header{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.author-avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0;border:1.5px solid var(--border);}
.author-info{flex:1;}
.author-name{font-size:.82rem;color:var(--text);font-weight:500;}
.author-date{font-size:.63rem;color:var(--muted);margin-top:1px;}
.book-badge{font-size:.63rem;padding:3px 9px;border-radius:8px;background:var(--accent-dim);border:1px solid rgba(245,200,107,.22);color:var(--accent);white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis;}

.card-quote{font-family:'Noto Serif KR',serif;font-size:.88rem;line-height:1.85;color:var(--text);margin-bottom:14px;position:relative;padding-left:14px;}
.card-quote::before{content:'"';position:absolute;left:0;top:-2px;font-size:1.4rem;color:var(--accent);opacity:.5;line-height:1;}

.card-actions{display:flex;gap:10px;align-items:center;}
.card-btn{display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:10px;border:1px solid var(--border);background:none;color:var(--muted);font-size:.72rem;cursor:pointer;font-family:'Pretendard',sans-serif;transition:.2s;}
.card-btn:hover{border-color:rgba(245,200,107,.3);color:var(--text);}
.card-btn.liked{border-color:rgba(248,113,113,.3);color:#f87171;background:rgba(248,113,113,.06);}
.card-btn.liked:hover{background:rgba(248,113,113,.1);}

/* cosmic star dots */
.star-dot{position:absolute;border-radius:50%;background:rgba(255,255,255,.7);pointer-events:none;}

/* comments section */
.comment-section{border-top:1px solid var(--border);margin-top:12px;padding-top:12px;display:none;}
.comment-section.open{display:block;}
.comment-item{display:flex;gap:8px;margin-bottom:8px;}
.comment-av{width:28px;height:28px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:.82rem;flex-shrink:0;}
.comment-body{flex:1;background:var(--card);border-radius:10px;padding:8px 11px;}
.comment-author{font-size:.66rem;color:var(--accent);font-weight:500;margin-bottom:2px;}
.comment-text{font-size:.76rem;color:var(--text);line-height:1.55;}
.comment-input-row{display:flex;gap:7px;margin-top:8px;}
.comment-input{flex:1;background:var(--card);border:1px solid var(--border);border-radius:9px;padding:7px 11px;color:var(--text);font-family:'Pretendard',sans-serif;font-size:.75rem;outline:none;transition:.2s;}
.comment-input:focus{border-color:rgba(245,200,107,.3);}
.comment-input::placeholder{color:rgba(157,169,199,.4);}
.comment-submit{background:var(--accent-dim);border:1px solid rgba(245,200,107,.3);color:var(--accent);padding:7px 13px;border-radius:9px;font-size:.72rem;cursor:pointer;font-family:'Pretendard',sans-serif;transition:.2s;}
.comment-submit:hover{background:rgba(245,200,107,.25);}

/* load more */
.load-more-btn{width:100%;padding:12px;border-radius:14px;border:1px solid var(--border);background:var(--card);color:var(--muted);font-family:'Pretendard',sans-serif;font-size:.76rem;cursor:pointer;transition:.2s;margin-top:8px;}
.load-more-btn:hover{border-color:rgba(245,200,107,.3);color:var(--accent);}

/* ── RIGHT SIDEBAR ──────────────────────────── */
.match-card{background:linear-gradient(135deg,rgba(14,20,50,.9),rgba(10,16,42,.9));border:1px solid rgba(96,165,250,.2);border-radius:14px;padding:14px;}
.match-genres{display:flex;flex-wrap:wrap;gap:5px;margin:9px 0;}
.genre-tag{font-size:.65rem;padding:3px 9px;border-radius:8px;background:rgba(96,165,250,.1);border:1px solid rgba(96,165,250,.2);color:#93c5fd;}
.match-btn{width:100%;padding:9px;border-radius:11px;background:linear-gradient(135deg,rgba(96,165,250,.18),rgba(167,139,250,.14));border:1px solid rgba(96,165,250,.3);color:#93c5fd;font-family:'Pretendard',sans-serif;font-size:.76rem;cursor:pointer;transition:.2s;font-weight:500;}
.match-btn:hover{background:linear-gradient(135deg,rgba(96,165,250,.28),rgba(167,139,250,.22));box-shadow:0 4px 16px rgba(96,165,250,.18);}
.match-label{font-size:.72rem;color:var(--muted);margin-bottom:5px;}

.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.stat-box{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 6px;text-align:center;}
.stat-num{font-family:'DM Serif Display',serif;font-size:1.2rem;color:var(--accent);}
.stat-lbl{font-size:.6rem;color:var(--muted);margin-top:2px;}

.reading-now{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px;display:flex;gap:10px;align-items:flex-start;}
.book-cover{width:52px;height:72px;border-radius:7px;flex-shrink:0;background:linear-gradient(135deg,#1e2f6e,#2d1b6e);display:flex;align-items:center;justify-content:center;font-size:1.4rem;border:1px solid var(--border);}
.reading-info{flex:1;min-width:0;}
.reading-title{font-size:.78rem;color:var(--text);font-weight:500;margin-bottom:3px;line-height:1.4;}
.reading-author{font-size:.65rem;color:var(--muted);margin-bottom:8px;}
.reading-prog-track{height:4px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden;}
.reading-prog-fill{height:100%;background:linear-gradient(90deg,var(--accent),#f59e0b);border-radius:2px;}
.reading-pct{font-size:.6rem;color:var(--muted);margin-top:3px;}

/* ── UTILITY ────────────────────────────────── */
.toast{position:fixed;bottom:24px;right:24px;background:var(--panel-solid);border:1px solid rgba(74,222,128,.3);border-radius:12px;padding:12px 18px;font-size:.8rem;color:var(--green);z-index:1000;transform:translateY(100px);opacity:0;transition:.35s cubic-bezier(.34,1.56,.64,1);pointer-events:none;}
.toast.show{transform:translateY(0);opacity:1;}
.toast.error{border-color:rgba(248,113,113,.3);color:#f87171;}

.loading-spin{display:inline-block;width:24px;height:24px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-center{display:flex;justify-content:center;padding:32px;}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .3s ease;}

@media(max-width:900px){
  .app-body{grid-template-columns:0 1fr 0;}
  .sidebar{display:none;}
}
@media(max-width:600px){
  body{padding-bottom:56px;}
  .bottom-nav{display:flex!important;position:fixed;bottom:0;left:0;right:0;height:56px;background:rgba(5,8,21,.97);border-top:1px solid var(--border);z-index:200;}
  .bn-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.58rem;color:var(--muted);text-decoration:none;gap:3px;}
  .bn-item.active{color:var(--accent);}
  .bn-icon{font-size:1.1rem;}
}
</style>
</head>
<body>

<canvas id="star-canvas"></canvas>

<!-- NAV -->
<nav class="nav">
  <a href="/" class="logo">
    <img src="/asset/images/Luma_logo_1.png" alt="LUMA" style="height:30px;object-fit:contain" onerror="this.style.display='none'">
    <div style="display:flex;flex-direction:column;gap:1px;margin-left:4px">
      <span style="font-family:'DM Serif Display',serif;font-size:1.1rem;color:var(--accent);line-height:1">LUMA</span>
      <span id="luma-tagline" style="font-size:.57rem;color:var(--muted);letter-spacing:.08em;font-style:italic;transition:opacity .5s,transform .5s">생각은 빛이 된다</span>
    </div>
  </a>
  <div class="nav-links">
    <a href="/" class="npill">별자리 지도</a>
    <a href="/heart" class="npill">마음 행성계</a>
    <a href="/lounge" class="npill">탐사 성운</a>
    <a href="/community/" class="npill">은하 공동체</a>
    <a href="/live" class="npill">궤도 정거장</a>
    <a href="/socrates" class="npill">지성의 위성</a>
    <a href="/social" class="npill active">독자 피드</a>
    <a href="/deepdive" class="npill">심층 관측소</a>
    <a href="/ocr" class="npill">광학 스캐너</a>
    <a href="/profile" class="npill">나의 조종석</a>
  </div>
  <div class="nav-user" id="nav-user"></div>
</nav>

<!-- APP BODY -->
<div class="app-body">

  <!-- LEFT SIDEBAR -->
  <aside class="sidebar sidebar-l">

    <!-- 독서 모임 -->
    <div>
      <div class="sb-section-title">독서 모임</div>
      <div class="club-list" id="club-list">
        <div style="text-align:center;padding:16px;"><div class="loading-spin" style="display:inline-block"></div></div>
      </div>
    </div>

    <!-- 독서 챌린지 -->
    <div>
      <div class="sb-section-title">독서 챌린지</div>
      <div class="challenge-card" id="challenge-card">
        <div class="ch-header">
          <span class="ch-title">이번 달 목표</span>
          <span class="ch-fraction" id="ch-fraction">3/5</span>
        </div>
        <div class="ch-bar-track">
          <div class="ch-bar-fill" id="ch-bar" style="width:60%"></div>
        </div>
        <div class="ch-label" id="ch-label">목표까지 2권 더! 우주를 향해 나아가세요 🚀</div>
      </div>
    </div>

    <!-- 나의 배지 -->
    <div>
      <div class="sb-section-title">나의 배지</div>
      <div class="badge-grid" id="badge-grid"></div>
    </div>

  </aside>

  <!-- MAIN FEED -->
  <main class="feed-main">
    <div class="feed-scroll" id="feed-scroll">

      <!-- Compose -->
      <div class="compose-card fade-in">
        <div class="compose-top">
          <div class="composer-avatar" id="composer-avatar">✨</div>
          <textarea class="compose-textarea" id="compose-text" placeholder="오늘 읽은 구절을 나눠보세요..." rows="3"></textarea>
        </div>
        <div class="compose-toolbar">
          <input class="compose-book-input" id="compose-book" type="text" placeholder="📖 책 제목 태그...">
          <div class="style-pills" id="style-pills">
            <button class="style-pill" data-style="dark" onclick="selectStyle(this,'dark')">어둠</button>
            <button class="style-pill" data-style="warm" onclick="selectStyle(this,'warm')">온기</button>
            <button class="style-pill" data-style="cosmic" onclick="selectStyle(this,'cosmic')">우주</button>
            <button class="style-pill" data-style="forest" onclick="selectStyle(this,'forest')">숲</button>
            <button class="style-pill" data-style="pure" onclick="selectStyle(this,'pure')">순수</button>
          </div>
          <button class="compose-post-btn" onclick="postCard()">✦ 올리기</button>
        </div>
      </div>

      <!-- Filter chips -->
      <div class="filter-chips">
        <button class="chip active" data-tag="" onclick="filterFeed(this,'')">전체</button>
        <button class="chip" data-tag="영감" onclick="filterFeed(this,'영감')">#영감</button>

//  STARFIELD
// ══════════════════════════════════════════════════
(function(){
  const c=document.getElementById('star-canvas');
  const ctx=c.getContext('2d');
  let W,H,stars=[];
  function resize(){
    W=c.width=window.innerWidth;
    H=c.height=window.innerHeight;
    initStars();
  }
  function initStars(){
    stars=[];
    const n=Math.floor((W*H)/5500);
    for(let i=0;i<n;i++){
      stars.push({
        x:Math.random()*W,y:Math.random()*H,
        r:Math.random()*1.3+.2,
        a:Math.random(),da:(Math.random()-.5)*.004
      });
    }
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    stars.forEach(s=>{
      s.a=Math.max(.05,Math.min(1,s.a+s.da));
      if(s.a<=.05||s.a>=1)s.da*=-1;
      ctx.beginPath();
      ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(200,220,255,${s.a})`;
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  window.addEventListener('resize',resize);
  resize();draw();
})();

(function(){
  const phrases=[
    {t:'생각은 빛이 된다',ko:true},
    {t:'읽을수록 더 깊은 우주로',ko:true},
    {t:'당신의 생각은 하나의 우주가 됩니다',ko:true},

  function show(idx){
    const p=phrases[idx];
    el.style.opacity='0';el.style.transform='translateY(-5px)';

  }
  show(0);
  setInterval(()=>{i=(i+1)%phrases.length;show(i);},9000);
})();

async function postCard(){
  const text=document.getElementById('compose-text').value.trim();
  const book=document.getElementById('compose-book').value.trim();
  if(!text){showToast('내용을 입력해주세요.','error');return;}
  const user=JSON.parse(localStorage.getItem('luma_user')||'{}');
  const payload={
    content:text,
    passage:text,
    thought:text,
    book_title:book||null,
    style:selectedCardStyle,
    card_style:selectedCardStyle,
    user_id:user.user_id||UID,
    display_name:user.display_name||'독서인',
    user_emoji:user.emoji||'📚'
  };
  try{
    const r=await fetch('/api/social/cards',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+(localStorage.getItem('luma_token')||'')},
      body:JSON.stringify(payload)
    });
    const d=await r.json().catch(()=>({}));
    if(r.ok&&d.ok!==false){
      document.getElementById('compose-text').value='';
      document.getElementById('compose-book').value='';
      showToast('✦ 피드에 올렸습니다!');
      currentPage=1;loadFeed(false);
    } else { showToast(d.error||'업로드 실패. 다시 시도해주세요.','error'); }
  } catch(e){
    prependDemoCard(text,book,selectedCardStyle,user);
    showToast('✦ 피드에 올렸습니다!');
    document.getElementById('compose-text').value='';
    document.getElementById('compose-book').value='';
  }
}

async function loadFeed(append){

    document.getElementById('load-more-btn').style.display='none';

    const url=`/api/social/feed?page=${currentPage}&limit=5${currentTag?'&tag='+encodeURIComponent(currentTag):''}`;
    const r=await fetch(url,{headers:{'Authorization':'Bearer '+(localStorage.getItem('luma_token')||'')}});
    if(!r.ok)throw new Error();
    const data=await r.json();
  const cards=(data.cards||data||[]).map(normalizeCard);
    renderFeed(cards,append);
    if(cards.length>=5)document.getElementById('load-more-btn').style.display='block';
  } catch(e){
    renderFeed(getDemoCards(),append);
    document.getElementById('load-more-btn').style.display='block';

//  BUILD CARD HTML
// ══════════════════════════════════════════════════
function buildCardHTML(c){
  const sc='card-'+(c.style||'dark');
  const date=formatDate(c.created_at);
  const badge=c.book_title?`<span class="book-badge" title="${esc(c.book_title)}">📖 ${esc(c.book_title)}</span>`:'';
  const cosmicDots=c.style==='cosmic'?genCosmicDots():'';
  return `<div class="feed-card ${sc} fade-in" id="card-${c.id}">
  ${cosmicDots}
  <div class="card-header">
    <div class="author-avatar" style="background:linear-gradient(135deg,${c.author_color||'#1e2f6e'},${shiftColor(c.author_color||'#1e2f6e')})">${c.author_emoji||'📚'}</div>
    <div class="author-info">
      <div class="author-name">${esc(c.author_name||'독자')}</div>
      <div class="author-date">${date}</div>
    </div>
    ${badge}
  </div>
  <div class="card-quote">${esc(c.content||'')}</div>
  <div class="card-actions">
    <button class="card-btn${c.liked?' liked':''}" id="like-btn-${c.id}" onclick="toggleLike('${c.id}',this)">♥ <span id="like-count-${c.id}">${c.like_count||0}</span></button>
    <button class="card-btn" onclick="toggleComments('${c.id}')">💬 <span id="comment-count-${c.id}">${c.comment_count||0}</span></button>
  </div>
  <div class="comment-section" id="comments-${c.id}">
    <div class="comment-list" id="comment-list-${c.id}"></div>
    <div class="comment-input-row">
      <input class="comment-input" id="comment-input-${c.id}" placeholder="댓글을 남겨보세요..." onkeydown="if(event.key==='Enter')submitComment('${c.id}')">
      <button class="comment-submit" onclick="submitComment('${c.id}')">↑</button>
    </div>
  </div>
</div>`;
}

function normalizeCard(raw){
  const c=raw||{};
  return {
    ...c,
    id:c.id||c.card_id,
    author_name:c.author_name||c.display_name||c.user_name||'독자',
    author_emoji:c.author_emoji||c.user_emoji||c.emoji||'📚',
    author_color:c.author_color||'#1e2f6e',
    content:c.content||c.passage||c.thought||'',
    style:c.style||c.card_style||'dark',
    like_count:c.like_count??c.likes??0,
    comment_count:c.comment_count??c.comments_cnt??c.comments??0,
    liked:!!(c.liked||c.is_liked)
  };
}

function genCosmicDots(){
  let h='';
  for(let i=0;i<14;i++){
    const x=Math.random()*100,y=Math.random()*100,s=Math.random()*1.8+.4,o=Math.random()*.5+.15;
    h+=`<div class="star-dot" style="left:${x.toFixed(1)}%;top:${y.toFixed(1)}%;width:${s.toFixed(1)}px;height:${s.toFixed(1)}px;opacity:${o.toFixed(2)}"></div>`;
  }
  return h;
}

function renderFeed(cards,append){
  const list=document.getElementById('feed-list');
  if(!append)list.innerHTML='';
  if(!cards.length&&!append){
    list.innerHTML='<div style="text-align:center;padding:48px;color:var(--muted);font-size:.84rem;">아직 게시물이 없습니다.<br>첫 번째로 생각을 나눠보세요 ✦</div>';
    return;
  }
  cards.forEach(c=>{
    const div=document.createElement('div');
    div.innerHTML=buildCardHTML(c);
    list.appendChild(div.firstElementChild);
  });
}

async function toggleLike(id,btn){
  const liked=btn.classList.contains('liked');
  const n=document.getElementById('like-count-'+id);
  if(liked){btn.classList.remove('liked');n.textContent=Math.max(0,parseInt(n.textContent)-1);}
  else{btn.classList.add('liked');n.textContent=parseInt(n.textContent)+1;}
  try{await fetch(`/api/social/cards/${id}/like`,{method:'POST',headers:{'Authorization':'Bearer '+(localStorage.getItem('luma_token')||'')}});}catch(e){}
}

//  COMMENTS
// ══════════════════════════════════════════════════
async function toggleComments(id){
  const sec=document.getElementById('comments-'+id);
  const open=sec.classList.toggle('open');
  if(open&&!sec.dataset.loaded){sec.dataset.loaded='1';await loadComments(id);}
}

async function loadComments(id){
  const listEl=document.getElementById('comment-list-'+id);
  try{
    const r=await fetch(`/api/social/cards/${id}/comments`,{headers:{'Authorization':'Bearer '+(localStorage.getItem('luma_token')||'')}});
    if(!r.ok)throw new Error();
    const data=await r.json();
    renderComments(listEl,data.comments||data);
  } catch(e){ renderComments(listEl,getDemoComments()); }
}

function renderComments(listEl,comments){
  listEl.innerHTML='';
  if(!comments.length){
    listEl.innerHTML='<div style="font-size:.72rem;color:var(--muted);padding:4px 0 8px">첫 댓글을 남겨보세요.</div>';
    return;
  }
  comments.forEach(c=>{
    const d=document.createElement('div');
    d.className='comment-item';
    d.innerHTML=`<div class="comment-av">${c.author_emoji||'📚'}</div><div class="comment-body"><div class="comment-author">${esc(c.author_name||'독자')}</div><div class="comment-text">${esc(c.content||'')}</div></div>`;
    listEl.appendChild(d);
  });
}

async function submitComment(id){
  const input=document.getElementById('comment-input-'+id);
  const text=input.value.trim();if(!text)return;
  const user=JSON.parse(localStorage.getItem('luma_user')||'{}');
  input.value='';
  const listEl=document.getElementById('comment-list-'+id);
  const d=document.createElement('div');d.className='comment-item';
  d.innerHTML=`<div class="comment-av">${user.emoji||'✨'}</div><div class="comment-body"><div class="comment-author">${esc(user.display_name||'나')}</div><div class="comment-text">${esc(text)}</div></div>`;
  listEl.appendChild(d);
  const cn=document.getElementById('comment-count-'+id);
  cn.textContent=parseInt(cn.textContent||'0')+1;
  try{await fetch(`/api/social/cards/${id}/comments`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+(localStorage.getItem('luma_token')||'')},body:JSON.stringify({content:text,text:text,user_id:UID,display_name:user.display_name||'나',emoji:user.emoji||'✨'})});}catch(e){}
}

      document.getElementById('stat-likes').textContent=d.my_stats.likes||'—';
      document.getElementById('stat-comments').textContent=d.my_stats.comments||'—';
    } else {setDemoStats();}
  } catch(e){setDemoStats();}
}

async function loadReadingNow(){
  try{
    const r=await fetch('/api/v2/shelf?user_id='+encodeURIComponent(UID),{headers:{'Authorization':'Bearer '+(localStorage.getItem('luma_token')||'')}});
    if(!r.ok)throw new Error();
    const d=await r.json();
    const books=(d.books||d||[]).filter(b=>b.status==='reading');
    if(books.length){
      const b=books[0];
      document.getElementById('reading-title').textContent=b.title||'제목 없음';
      document.getElementById('reading-author').textContent=b.author||'';
      const pct=b.progress||0;
      document.getElementById('reading-prog').style.width=pct+'%';
      document.getElementById('reading-pct').textContent=pct+'% 완독';
      document.getElementById('reading-cover').textContent=b.emoji||'📖';
    } else {setDemoReading();}
  } catch(e){setDemoReading();}
}
function setDemoReading(){
  document.getElementById('reading-title').textContent='파친코';
  document.getElementById('reading-author').textContent='이민진';
  document.getElementById('reading-prog').style.width='63%';
  document.getElementById('reading-pct').textContent='63% 완독';
  document.getElementById('reading-cover').textContent='🌊';
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function formatDate(iso){
  try{
    const d=new Date(iso),now=new Date(),diff=Math.floor((now-d)/1000);
    if(diff<60)return '방금 전';
    if(diff<3600)return `${Math.floor(diff/60)}분 전`;
    if(diff<86400)return `${Math.floor(diff/3600)}시간 전`;
    if(diff<604800)return `${Math.floor(diff/86400)}일 전`;
    return d.toLocaleDateString('ko-KR',{month:'short',day:'numeric'});
  } catch(e){return '';}
}

function shiftColor(hex){
  try{
    const n=parseInt(hex.replace('#',''),16);
    const r=Math.min(255,((n>>16)&255)+35),g=Math.min(255,((n>>8)&255)+20),b=Math.min(255,(n&255)+65);
    return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
  } catch(e){return '#2d1b6e';}
}
