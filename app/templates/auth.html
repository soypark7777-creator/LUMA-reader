<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUMA - 로그인</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Orbitron:wght@500;600&family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#050815;--panel:rgba(9,14,32,.86);--line:rgba(160,184,255,.18);--text:#eef3ff;--muted:#9da9c7;--gold:#f5c86b;--cyan:#8fdcff;--violet:#b9a5ff}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:grid;place-items:center;padding:26px;color:var(--text);font-family:Pretendard,system-ui,sans-serif;background:radial-gradient(circle at 18% 20%,rgba(143,220,255,.2),transparent 28%),radial-gradient(circle at 82% 12%,rgba(185,165,255,.18),transparent 30%),linear-gradient(135deg,#03040b,#081022 48%,#050815)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(circle,rgba(255,255,255,.75) 0 1px,transparent 1.8px);background-size:74px 74px;opacity:.18;animation:starDrift 18s linear infinite}
@keyframes starDrift{to{transform:translate3d(-74px,74px,0)}}
.wrap{width:min(440px,100%)}
.logo-area{display:flex;align-items:center;justify-content:center;margin-bottom:26px}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--text);font-family:Cinzel,serif;font-size:1.25rem;letter-spacing:.08em}
.logo img{width:50px;height:50px;object-fit:contain}
.logo-sub,.luma-brand-text{display:block;margin-top:4px;color:var(--muted);font-size:.82rem;letter-spacing:0}
.auth-card{position:relative;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:0 28px 80px rgba(0,0,0,.46);backdrop-filter:blur(18px)}
.auth-card:before{content:"";position:absolute;inset:-1px;background:linear-gradient(120deg,transparent,rgba(245,200,107,.14),transparent);pointer-events:none}
.db-badge{position:relative;display:inline-flex;margin-bottom:16px;padding:5px 10px;border-radius:999px;font-size:.72rem;border:1px solid rgba(245,200,107,.22);color:var(--gold);background:rgba(245,200,107,.08)}
.db-badge.ok{border-color:rgba(94,234,212,.28);color:#8fffe8;background:rgba(94,234,212,.08)}
.auth-tabs{position:relative;display:flex;gap:6px;padding:5px;margin-bottom:20px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.auth-tab{flex:1;border:0;border-radius:10px;padding:10px 12px;background:transparent;color:var(--muted);font-family:Pretendard,sans-serif;font-weight:700;cursor:pointer}
.auth-tab.active{color:#07101f;background:linear-gradient(135deg,var(--gold),#ffe8a1)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-group{margin-bottom:14px}
.form-label{display:block;margin-bottom:6px;color:var(--muted);font-size:.75rem;font-weight:700}
.form-input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(4,8,20,.72);color:var(--text);font:inherit;outline:none}
.form-input:focus{border-color:rgba(143,220,255,.58);box-shadow:0 0 0 3px rgba(143,220,255,.1)}
.btn-submit,.btn-social{width:100%;border-radius:13px;padding:13px 14px;font:700 .92rem Pretendard,sans-serif;cursor:pointer;transition:.18s}
.btn-submit{border:1px solid rgba(245,200,107,.5);color:#07101f;background:linear-gradient(135deg,var(--gold),#ffe8a1)}
.btn-submit:disabled{opacity:.55;cursor:not-allowed}
.btn-social{border:1px solid var(--line);color:var(--text);background:rgba(255,255,255,.05)}
.divider{display:flex;align-items:center;gap:12px;margin:16px 0}
.divider-line{flex:1;height:1px;background:var(--line)}
.divider-text{color:var(--muted);font-size:.72rem}
.msg{display:none;margin-top:12px;padding:11px 13px;border-radius:12px;font-size:.8rem}
.msg.success{display:block;color:#9fffe7;background:rgba(94,234,212,.09);border:1px solid rgba(94,234,212,.24)}
.msg.error{display:block;color:#ffb4c2;background:rgba(248,113,113,.09);border:1px solid rgba(248,113,113,.24)}
.genre-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.genre-chip{border:1px solid var(--line);border-radius:10px;padding:8px 6px;background:rgba(255,255,255,.04);color:var(--muted);font:700 .72rem Pretendard,sans-serif;cursor:pointer}
.genre-chip.sel{border-color:rgba(245,200,107,.5);color:var(--gold);background:rgba(245,200,107,.1)}
</style>
</head>
<body>
<main class="wrap">
  <div class="logo-area">
    <a href="/" class="logo">
      <img src="/asset/images/Luma_logo_1.png" alt="LUMA">
      <span>LUMA</span>
      <span class="logo-sub">생각은 빛이 된다</span>
    </a>
  </div>

  <section class="auth-card">
    <div id="db-badge" class="db-badge mock">상태 확인 중</div>

    <div class="auth-tabs">
      <button class="auth-tab active" type="button" onclick="switchTab('login',this)">로그인</button>
      <button class="auth-tab" type="button" onclick="switchTab('signup',this)">회원가입</button>
    </div>

    <div id="form-login">
      <div class="form-group">
        <label class="form-label" for="login-email">이메일</label>
        <input class="form-input" type="email" id="login-email" placeholder="your@email.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label" for="login-pw">비밀번호</label>
        <input class="form-input" type="password" id="login-pw" placeholder="비밀번호" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
      </div>
      <button class="btn-submit" id="btn-login" type="button" onclick="doLogin()">로그인</button>
      <div class="divider"><div class="divider-line"></div><div class="divider-text">또는</div><div class="divider-line"></div></div>
      <button class="btn-social" type="button" onclick="demoLogin()">데모 계정으로 바로 시작</button>
      <div class="msg" id="login-msg"></div>
    </div>

    <div id="form-signup" style="display:none">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="su-name">이름 *</label>
          <input class="form-input" type="text" id="su-name" placeholder="이름">
        </div>
        <div class="form-group">
          <label class="form-label" for="su-age">나이</label>
          <input class="form-input" type="number" id="su-age" placeholder="25" min="10" max="100">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label" for="su-email">이메일 *</label>
        <input class="form-input" type="email" id="su-email" placeholder="your@email.com">
      </div>
      <div class="form-group">
        <label class="form-label" for="su-pw">비밀번호 * (4자 이상)</label>
        <input class="form-input" type="password" id="su-pw" placeholder="비밀번호">
      </div>
      <div class="form-group">
        <label class="form-label" for="su-region">지역</label>
        <input class="form-input" type="text" id="su-region" placeholder="서울, 부산, 제주...">
      </div>
      <div class="form-group">
        <label class="form-label">선호 장르</label>
        <div class="genre-grid" id="genre-grid">
          {% for g in ['문학','철학','역사','과학','SF','경제','심리','자기계발','예술','여행'] %}
          <button class="genre-chip" type="button" onclick="selGenre(this,'{{ g }}')">{{ g }}</button>
          {% endfor %}
        </div>
        <input type="hidden" id="su-genre">
      </div>
      <button class="btn-submit" id="btn-signup" type="button" onclick="doSignup()">별자리 시작하기</button>
      <div class="msg" id="signup-msg"></div>
    </div>
  </section>
</main>

<script>
function switchTab(tab, btn) {
  document.querySelectorAll('.auth-tab').forEach((item) => item.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('form-login').style.display = tab === 'login' ? '' : 'none';
  document.getElementById('form-signup').style.display = tab === 'signup' ? '' : 'none';
}

async function checkDBStatus() {
  try {
    const r = await fetch('/api/v2/system/status');
    const d = await r.json();
    const el = document.getElementById('db-badge');
    if ((d.mysql || '').includes('연결')) {
      el.className = 'db-badge ok';
      el.textContent = 'MySQL 연결됨';
    } else {
      el.className = 'db-badge mock';
      el.textContent = 'Mock 모드';
    }
  } catch (e) {}
}
checkDBStatus();

if (localStorage.getItem('luma_token')) {
  window.location.href = '/';
}

let selG = '';
function selGenre(btn, g) {
  document.querySelectorAll('.genre-chip').forEach((item) => item.classList.remove('sel'));
  btn.classList.add('sel');
  selG = g;
  document.getElementById('su-genre').value = g;
}

async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pw = document.getElementById('login-pw').value;
  const msg = document.getElementById('login-msg');
  const btn = document.getElementById('btn-login');
  if (!email || !pw) {
    showMsg(msg, 'error', '이메일과 비밀번호를 입력해주세요.');
    return;
  }

  btn.disabled = true;
  btn.textContent = '로그인 중...';
  try {
    const r = await fetch('/api/v2/auth/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({email, password: pw})
    });
    const d = await r.json();
    if (d.ok) {
      showMsg(msg, 'success', '로그인 성공! 별자리 지도로 이동합니다.');
      localStorage.setItem('luma_token', d.token);
      localStorage.setItem('luma_user', JSON.stringify(d.user));
      setTimeout(() => window.location.href = '/', 700);
    } else {
      showMsg(msg, 'error', d.error || '로그인에 실패했습니다.');
    }
  } catch (e) {
    showMsg(msg, 'error', '서버에 연결할 수 없습니다.');
  } finally {
    btn.disabled = false;
    btn.textContent = '로그인';
  }
}

async function demoLogin() {
  const msg = document.getElementById('login-msg');
  try {
    const r = await fetch('/api/v2/auth/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({email: 'demo@luma.kr', password: 'demo1234'})
    });
    const d = await r.json();
    if (d.ok) {
      localStorage.setItem('luma_token', d.token);
      localStorage.setItem('luma_user', JSON.stringify(d.user));
      window.location.href = '/heart';
      return;
    }
  } catch (e) {}
  localStorage.removeItem('luma_token');
  localStorage.setItem('luma_user', JSON.stringify({
    user_id: 'user_demo',
    display_name: '소연',
    email: 'demo@luma.kr',
    emoji: '✨'
  }));
  showMsg(msg, 'success', '데모 모드로 시작합니다.');
  setTimeout(() => window.location.href = '/heart', 500);
}

async function doSignup() {
  const name = document.getElementById('su-name').value.trim();
  const email = document.getElementById('su-email').value.trim();
  const pw = document.getElementById('su-pw').value;
  const age = document.getElementById('su-age').value;
  const region = document.getElementById('su-region').value.trim();
  const genre = document.getElementById('su-genre').value;
  const msg = document.getElementById('signup-msg');
  const btn = document.getElementById('btn-signup');

  if (!name) { showMsg(msg, 'error', '이름을 입력해주세요.'); return; }
  if (!email) { showMsg(msg, 'error', '이메일을 입력해주세요.'); return; }
  if (!pw || pw.length < 4) { showMsg(msg, 'error', '비밀번호는 4자 이상이어야 합니다.'); return; }

  btn.disabled = true;
  btn.textContent = '가입 중...';
  try {
    const r = await fetch('/api/v2/auth/register', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        email,
        password: pw,
        display_name: name,
        emoji: '✨',
        age: age ? parseInt(age, 10) : null,
        region,
        genre_prefs: genre ? [genre] : []
      })
    });
    const d = await r.json();
    if (d.ok) {
      showMsg(msg, 'success', '회원가입 완료! 별자리 지도로 이동합니다.');
      localStorage.setItem('luma_token', d.token);
      localStorage.setItem('luma_user', JSON.stringify(d.user));
      setTimeout(() => window.location.href = '/', 700);
    } else {
      showMsg(msg, 'error', d.error || '회원가입에 실패했습니다.');
    }
  } catch (e) {
    showMsg(msg, 'error', '서버에 연결할 수 없습니다.');
  } finally {
    btn.disabled = false;
    btn.textContent = '별자리 시작하기';
  }
}

function showMsg(el, type, text) {
  el.className = 'msg ' + type;
  el.textContent = text;
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 5000);
}
</script>
</body>
</html>
