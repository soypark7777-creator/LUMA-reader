# ══════════════════════════════════════════════
#  LUMA Docker Compose
#  개발: docker-compose up
#  프로덕션: docker-compose --profile production up -d
# ══════════════════════════════════════════════
version: "3.9"

services:

  luma-app:
    build: { context: ., dockerfile: Dockerfile, target: runtime }
    container_name: luma-app
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./app:/app/app:ro
      - ./app.py:/app/app.py:ro
      - ./firebase-credentials.json:/app/firebase-credentials.json:ro
    healthcheck:
      test: ["CMD","python","-c","import urllib.request;urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks: [luma-net]

  luma-nginx:
    image: nginx:alpine
    container_name: luma-nginx
    restart: unless-stopped
    ports: ["80:80"]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [luma-app]
    networks: [luma-net]
    profiles: [production]

networks:
  luma-net:
    driver: bridge
